[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vyom_jepa"
version = "0.1.0"
description = "Quantum-Latent Predictive Architecture for Fock-Space Representations"
readme = "README.md"
authors = [
  { name = "Divyang Panchasara", email = "divyang4481@example.com" },
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "torch>=2.0",
    "numpy",
    "pyyaml",
]
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["src"]
